[package]
name = "convert-images-engine"
version = "1.3.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
blake3 = "=1.8.2"
lebe = "=0.5.2"
half = "=2.4.1"
rayon-core = "=1.12.1"
exr = "=1.74.0"
uuid = "=1.20.0"
clap = { version = "=4.5.57", features = ["derive"] }
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "tiff", "bmp", "gif", "webp"] }
imagepipe = "=0.5.0"
infer = "0.22.0"
rawloader = "0.37.2"
# LibRaw embarquée (repli quand rawloader ne connaît pas le boîtier), voir vendor/README.md
rsraw-sys = { path = "vendor/libraw-sys" }
rayon = "=1.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
walkdir = "2.5.0"
